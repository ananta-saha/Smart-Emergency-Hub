<!DOCTYPE html>
<html>
<head>
    <title>Add Organization</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-page">

        <div class="form-card">

            <div class="form-title">

                <span>🏢</span>

                <div>
                    <h1>Add Organization</h1>
                    <p>Register a new organization</p>
                </div>

            </div>


            <form onsubmit="addOrganization(event)">

                <div class="content">

                    <label>Organization Name</label>

                    <input type="text"
                           name="organization_name"
                           placeholder="Enter organization name">

                </div>


                <div class="content">

                    <label>Email Address</label>

                    <input type="email"
                           name="email"
                           placeholder="Enter email">

                </div>


                <div class="content">

                    <label>Phone Number</label>

                    <input type="tel"
                           name="phone"
                           placeholder="Enter phone number">

                </div>


                <div class="content">

                    <label>Address</label>

                    <input type="text"
                           name="address"
                           placeholder="Enter address">

                </div>


                <div class="content">

                    <label>Status</label>

                    <select name="status">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div class="form-buttons">

                    <button type="submit"
                            class="main-btn">
                        Add Organization
                    </button>

                    <button type="button"
                            class="cancel-btn"
                            onclick="openPage('organizations.html')">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
