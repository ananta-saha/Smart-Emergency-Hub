<!DOCTYPE html>
<html>

<head>

    <title>Add Organization</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page organization-page">

    <div class="form-box">

        <h1>Add Organization</h1>

        <p class="subtitle">
            Register a new organization in Smart Emergency Hub
        </p>


        <div class="form-group">

            <label>Organization Name</label>

            <input
                type="text"
                placeholder="Enter organization name">

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="organization@gmail.com">

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    placeholder="017XXXXXXXX">

            </div>

        </div>


        <div class="form-group">

            <label>Address</label>

            <input
                type="text"
                placeholder="Enter organization address">

        </div>


        <div class="form-group">

            <label>Organization Type</label>

            <select>

                <option value="">Select organization type</option>
                <option>NGO</option>
                <option>Charity Organization</option>
                <option>Medical Organization</option>
                <option>Emergency Support Organization</option>

            </select>

        </div>


        <div class="form-group">

            <label>Status</label>

            <select>

                <option>Active</option>
                <option>Pending</option>

            </select>

        </div>


        <div class="action-buttons">

            <button
                class="main-btn blue-btn"
                onclick="showMessage('Organization added successfully')">

                Add Organization

            </button>


            <button
                class="back-btn"
                onclick="goTo('organizations.html')">

                Cancel

            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
