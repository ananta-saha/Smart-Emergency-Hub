<!DOCTYPE html>
<html>

<head>

    <title>Add Service Provider</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page provider-page">

    <div class="form-box">

        <h1>Add Service Provider</h1>

        <p class="subtitle">
            Register a new emergency service provider
        </p>


        <div class="form-row">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    placeholder="Enter full name">

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    placeholder="017XXXXXXXX">

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="provider@gmail.com">

            </div>


            <div class="form-group">

                <label>Service Type</label>

                <select>

                    <option value="">Select service</option>
                    <option>Ambulance</option>
                    <option>Hospital</option>
                    <option>Fire Service</option>
                    <option>Police</option>
                    <option>Blood Donor</option>

                </select>

            </div>

        </div>


        <div class="form-group">

            <label>Location</label>

            <input
                type="text"
                placeholder="Enter service provider location">

        </div>


        <div class="form-group">

            <label>Status</label>

            <select>

                <option>Active</option>
                <option>Pending</option>

            </select>

        </div>


        <div class="action-buttons">

            <button
                class="main-btn green-btn"
                onclick="showMessage('Service provider added successfully')">

                Add Provider

            </button>


            <button
                class="back-btn"
                onclick="goTo('service_providers.html')">

                Cancel

            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
