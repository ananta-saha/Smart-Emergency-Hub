<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

    <div class="login-box">

        <div class="logo">
            🚨
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Smart Emergency Hub
        </p>


        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                placeholder="admin@example.com">

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                placeholder="Enter password">

        </div>


        <button
            class="submit-btn"
            onclick="goTo('admin_dashboard.html')">

            Login

        </button>


        <p class="link-text">

            Don't have an account?

            <a href="admin_registration.html">
                Register
            </a>

        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
