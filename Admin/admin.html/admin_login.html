<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Smart Emergency Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-card">

        <div class="logo-circle">🚨</div>

        <h1>Smart Emergency Hub</h1>
        <p class="subtitle">Admin Login</p>

        <form onsubmit="loginAdmin(event)">

            <div class="content">
                <label>Email Address</label>
                <input type="email" id="loginEmail" name="email" placeholder="admin@example.com">
            </div>

            <div class="content">
                <label>Password</label>
                <input type="password" id="loginPassword" name="password" placeholder="Enter password">
            </div>

            <button type="submit" class="main-btn">Login</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="admin_registration.html">Register</a>
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
