<!DOCTYPE html>
<html>
<head>
    <title>Edit Service Provider</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-page">

        <div class="form-card">

            <div class="form-title">

                <span>✏️</span>

                <div>
                    <h1>Edit Service Provider</h1>
                    <p>Update provider information</p>
                </div>

            </div>


            <form onsubmit="updateProvider(event)">

                <div class="content">

                    <label>Full Name</label>

                    <input type="text"
                           name="name"
                           value="Rahim Ahmed">

                </div>


                <div class="content">

                    <label>Email Address</label>

                    <input type="email"
                           name="email"
                           value="rahim@gmail.com">

                </div>


                <div class="content">

                    <label>Phone Number</label>

                    <input type="tel"
                           name="phone"
                           value="01711111111">

                </div>


                <div class="content">

                    <label>Service Type</label>

                    <select name="service_type">

                        <option>Ambulance</option>
                        <option>Hospital</option>
                        <option>Fire Service</option>
                        <option>Police</option>
                        <option>Blood Donor</option>

                    </select>

                </div>


                <div class="content">

                    <label>Location</label>

                    <input type="text"
                           name="location"
                           value="Dhaka">

                </div>


                <div class="content">

                    <label>Status</label>

                    <select name="status">

                        <option>Active</option>
                        <option>Pending</option>
                        <option>Inactive</option>

                    </select>

                </div>


                <div class="form-buttons">

                    <button type="submit"
                            class="main-btn">
                        Update Provider
                    </button>

                    <button type="button"
                            class="cancel-btn"
                            onclick="openPage('service_providers.html')">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
