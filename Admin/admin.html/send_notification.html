<!DOCTYPE html>
<html>

<head>

    <title>Send Notification</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page">

<div class="form-box">

    <h1>
        Send Notification
    </h1>

    <p class="subtitle">
        Send notification to system users
    </p>


    <div class="form-group">

        <label>
            Receiver
        </label>

        <select>

            <option>All</option>
            <option>Organization</option>
            <option>Service Provider</option>

        </select>

    </div>


    <div class="form-group">

        <label>
            Subject
        </label>

        <input
            type="text"
            placeholder="Enter notification subject">

    </div>


    <div class="form-group">

        <label>
            Message
        </label>

        <textarea
            placeholder="Write notification message"></textarea>

    </div>


    <div class="action-buttons">

        <button
            class="main-btn purple-btn"
            onclick="goTo('notifications.html')">

            Send Notification

        </button>

        <button
            class="back-btn"
            onclick="goTo('notifications.html')">

            Back

        </button>

    </div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
