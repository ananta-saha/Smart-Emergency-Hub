<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Login - Emergency Help Hub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="navbar">
        <h2>🚑 Emergency Finder</h2>
        <nav>
            <a href="../index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>
    <div class="main-container">
        <form method="post">
            <h1>Welcome Back</h1>
            <p>Login to your Citizen account</p>
            <div class="field">
                <label for="email">Email or Phone</label>
                <input type="text" placeholder="enter your email or phone" id="email" name="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" placeholder="enter your password" id="password" name="password">
            </div>
            <div class="buttons">
                <a href="dashboard.html">
                    <button type="button" class="btn-primary">Login</button>
                </a>
            </div>
            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </form>
    </div>

    <footer>
        <p>© 2026 Emergency Finder - Citizen Portal.</p>
    </footer>
</body>

</html>
