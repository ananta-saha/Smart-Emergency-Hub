<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheelchair Requirement</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="WheelchairHub">
    <header>
        <h2 class="early">Emergency Help Hub</h2>
    </header>
    <main class="cntrs">
        <h1>Wheelchair Requirement</h1>
        <form method="post">
            <p>Does the patient need a wheelchair?</p>
            <input type="radio" id="wheelchairNo" name="wheelchair" value="No" class="toggle-no" checked>
            <label for="wheelchairNo" class="radio-label">No</label>
            <input type="radio" id="wheelchairYes" name="wheelchair" value="Yes" class="toggle-yes">
            <label for="wheelchairYes" class="radio-label">Yes</label>
            <div class="wheelchair-count-box">
                <label for="wheelchairNumber">Number of Wheelchairs</label>
                <input type="number" id="wheelchairNumber" name="wheelchairNumber" min="1" placeholder="Enter quantity">
            </div>
            <div class="btnss">
                <a href="injury.html">
                    <button type="button" class="primary-btn">Continue</button>
                </a>
                <a href="dashboard.html">
                    <button type="button" class="secondary-btn">Dashboard</button>
                </a>
            </div>
        </form>
    </main>
    <footer>
        <p>© 2026 Emergency Finder - Citizen Portal.</p>
    </footer>
</body>

</html>
