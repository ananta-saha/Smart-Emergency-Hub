    <main>
        <h2>Organization Profile</h2>
        <div class="box">
            <label for="profileName">Organization Name</label>
            <input type="text" id="profileName" name="profileName" placeholder="Organization Name">

            <label for="profileEmail">Email</label>
            <input type="email" id="profileEmail" name="profileEmail" placeholder="Email">

            <label for="profilePhone">Phone Number</label>
            <input type="text" id="profilePhone" name="profilePhone" placeholder="Phone Number">

            <label for="profileAddress">Address</label>
            <textarea id="profileAddress" name="profileAddress" placeholder="Organization Address"></textarea>

            <button onclick="updateProfile()">Update Profile</button>
        </div>
