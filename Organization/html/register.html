<!DOCTYPE html>
<html lang="en">

<head>
    <title>Emergency Help Hub - Registration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>🚨 Emergency Help Hub</h1>
    </header>

    <main>
        <section class="auth-page">
            <div class="auth-box">
                <h1>🚨 Emergency Help Hub</h1>
                <h2>Organization Registration</h2>

                <form action="../index.html">
                    <label for="orgName"></label>
                    <input type="text" id="orgName" name="orgName" placeholder="Organization Name">

                    <label for="regEmail"></label>
                    <input type="email" id="regEmail" name="regEmail" placeholder="Email">

                    <label for="regPassword"></label>
                    <input type="password" id="regPassword" name="regPassword" placeholder="Password">

                    <label for="phone"></label>
                    <input type="text" id="phone" name="phone" placeholder="Phone Number">

                    <label for="address"></label>
                    <input type="text" id="address" name="address" placeholder="Organization Address">

                    <button type="submit">Register</button>
                </form>

                <p>
                    Already have an account?
                    <a href="../index.html">Login</a>
                </p>

            </div>
        </section>

    </main>

    <footer>
        <p>
            © 2026 Emergency Help Hub |
            Organization Management
        </p>
    </footer>

</body>

</html>
