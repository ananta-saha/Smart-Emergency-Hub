<!DOCTYPE html>
<html lang="en">

<head>
    <title>Emergency Help Hub - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🚨 Emergency Help Hub</h1>
    </header>

    <main>
        <section class="auth-page">
            <div class="auth-box">
                <h1>🚨 Emergency Help Hub</h1>
                <h2>Organization Login</h2>

                <form action="html/dashboard.html">
                    <label for="loginEmail"></label>
                    <input type="text" id="loginEmail" name="loginEmail" placeholder="Enter Address or mobile number">

                    <label for="loginPassword"></label>
                    <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter Password">

                    <button type="submit">Login</button>
                </form>

                <p>
                    Don't have an account?<a href="html/register.html">Register</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>
            © 2026 Emergency Help Hub |
            Organization Management
        </p>
    </footer>

</body>

</html>
